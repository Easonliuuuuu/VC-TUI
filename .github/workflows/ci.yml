name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  build:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Verify formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l . )
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test auto labeling
        if: runner.os == 'Linux'
        run: node --test scripts/test-labeler.cjs

      - name: Verify release pins
        if: runner.os == 'Linux'
        run: scripts/check-release-pins.sh

      - name: Vet
        run: go vet ./...

      # The in-process simulator suite lives in tests/ and exercises packages
      # outside that directory. -coverpkg credits that work in the aggregate
      # profile; without it Go reports only package-local coverage.
      - name: Test with coverage
        if: runner.os == 'Linux'
        run: |
          go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage-summary.txt
          go tool cover -html=coverage.out -o coverage.html
          {
            echo '## Test coverage'
            echo
            echo '```text'
            tail -n 1 coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        if: runner.os != 'Linux'
        run: go test -race ./...

      - name: Upload coverage report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
          if-no-files-found: error
          retention-days: 14

      - name: Build
        run: go build ./...

  staticcheck:
    name: Staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

  tui-scenarios:
    name: TUI scenario harness
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Run deterministic semantic scenarios
        run: go run ./cmd/vsfleet-harness test --results-dir "${{ runner.temp }}/vsfleet-scenarios"
      - name: Upload scenario diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tui-scenario-results-${{ matrix.os }}
          path: ${{ runner.temp }}/vsfleet-scenarios
          if-no-files-found: ignore

  tui-pty:
    name: TUI real-terminal PTY journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Run actual testbed process in a PTY
        run: scripts/testbed pty --results-dir "${{ runner.temp }}/vsfleet-pty"
      - name: Upload PTY failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tui-pty-results
          path: ${{ runner.temp }}/vsfleet-pty
          if-no-files-found: error

  release-snapshot:
    name: Release snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Mirrors the goreleaser job in release.yml, so a broken .goreleaser.yaml,
      # Dockerfile, or cross-compile fails here instead of at tag time.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          check-latest: true

      - uses: docker/setup-buildx-action@v4

      # A snapshot builds and loads one image per platform, and buildx
      # refuses index annotations on a single-platform export. Everything
      # else in this copy is the release configuration unchanged.
      - name: Derive the snapshot configuration
        run: sed 's/"index,manifest:/"manifest:/' .goreleaser.yaml > "${RUNNER_TEMP}/goreleaser-snapshot.yaml"

      - name: Build every release artifact without publishing
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign --config ${{ runner.temp }}/goreleaser-snapshot.yaml
        env:
          # The Homebrew cask templates this token even when nothing is pushed.
          TAP_GITHUB_TOKEN: snapshot-unused

      - name: Smoke test release binaries and image
        run: |
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 windows_arm64; do
            ls dist/vsfleet_*_"${target}"*.{tar.gz,zip} >/dev/null 2>&1 || { echo "missing archive for $target"; exit 1; }
          done
          dist/vsfleet_linux_amd64_v1/vsfleet --version
          image="$(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep '^ghcr.io/easonliuuuuu/vsfleet:' | grep -m1 amd64 || true)"
          image="${image:-$(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -m1 '^ghcr.io/easonliuuuuu/vsfleet:')}"
          test -n "$image" || { echo "goreleaser loaded no vsfleet image"; docker image ls; exit 1; }
          docker run --rm --platform linux/amd64 "$image" --version
          docker run --rm --platform linux/amd64 "$image" --help >/dev/null

  kubernetes-e2e:
    name: Kubernetes end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # Rebuilt independently of the release-snapshot job so this job's
      # failure domain stays confined to Kubernetes/kind behavior. These are
      # small distroless-COPY images, so rebuilding them here is cheap
      # relative to the kind cluster below.
      - name: Build Linux amd64 test images
        run: |
          mkdir -p linux/amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o linux/amd64/vsfleet ./cmd/vsfleet
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o linux/amd64/vsfleet-vcsim ./cmd/vsfleet-vcsim
          docker build --build-arg TARGETPLATFORM=linux/amd64 -t vsfleet:ci-test .
          docker build -f Dockerfile.vcsim -t vsfleet-vcsim:ci-test .

      - name: Create Kubernetes test cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: vsfleet-ci

      - name: Load local images into Kubernetes
        run: kind load docker-image --name vsfleet-ci vsfleet:ci-test vsfleet-vcsim:ci-test

      # The e2e fixture uses a kind-only hostPath PV. Unlike normal CSI-backed
      # volumes, hostPath does not apply the workload's fsGroup automatically.
      - name: Prepare writable Kubernetes test storage
        run: |
          docker exec vsfleet-ci-control-plane mkdir -p /var/lib/vsfleet-e2e-history
          docker exec vsfleet-ci-control-plane chown 65532:65532 /var/lib/vsfleet-e2e-history

      - name: Run Kubernetes end-to-end workload
        env:
          VSFLEET_K8S_DEBUG_DIR: ${{ runner.temp }}/kubernetes-debug
        run: ./scripts/test-kubernetes.sh

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: kubernetes-debug
          path: ${{ runner.temp }}/kubernetes-debug

  integration-vcsim:
    name: Multi-vCenter vcsim integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "${{ env.GO_VERSION }}"
          check-latest: true

      # govmomi v0.56.0 exposes simulator as a library rather than an
      # installable github.com/vmware/govmomi/vcsim module. This launcher is
      # still an independent OS process and is compiled against that pinned
      # module version from go.mod.
      - name: Build vcsim-compatible launcher
        run: go build -o "${RUNNER_TEMP}/vsfleet-vcsim" ./cmd/vsfleet-vcsim

      - name: Run integration suite
        env:
          VSFLEET_VCSIM_BIN: ${{ runner.temp }}/vsfleet-vcsim
          VSFLEET_VCSIM_REQUIRED: "1"
          VSFLEET_VCSIM_LOG_DIR: ${{ runner.temp }}/vcsim-logs
        # The untagged in-process tests in tests/ already ran in the build job.
        run: go test -tags integration -race -run '^TestVCSIM' ./tests/... -timeout 20m

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vcsim-logs
          path: ${{ runner.temp }}/vcsim-logs
