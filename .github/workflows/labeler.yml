name: Auto label

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply repository labels
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const managedLabels = {
              tui: {
                color: "1d76db",
                description: "Terminal UI and interactive operator experience"
              },
              assessment: {
                color: "5319e7",
                description: "Assessments, findings, health, history, drift, and trends"
              },
              compatibility: {
                color: "0e8a16",
                description: "RVTools interoperability and export compatibility"
              },
              vsphere: {
                color: "0052cc",
                description: "vSphere API, inventory collection, and resource mapping"
              },
              docs: {
                color: "0075ca",
                description: "Documentation and examples"
              },
              ci: {
                color: "6f42c1",
                description: "CI, GitHub Actions, and repository automation"
              },
              release: {
                color: "fbca04",
                description: "Release tooling, packaging, and versioning"
              },
              config: {
                color: "bfdadc",
                description: "Configuration, contexts, and operator settings"
              },
              deps: {
                color: "0366d6",
                description: "Dependency and toolchain updates"
              }
            };

            async function ensureLabelExists(name) {
              const spec = managedLabels[name];
              if (!spec) return;
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color: spec.color,
                  description: spec.description
                });
              }
            }

            // workflow_dispatch synchronizes all managed labels.
            if (context.eventName === "workflow_dispatch") {
              for (const name of Object.keys(managedLabels)) {
                await ensureLabelExists(name);
              }
              core.info("Managed labels are synchronized.");
              return;
            }

            const item = context.payload.pull_request ?? context.payload.issue;
            if (!item) {
              core.info("No issue or pull request payload to label.");
              return;
            }

            const title = (item.title ?? "").trim();
            const components = [
              "tui", "assessment", "compatibility", "vsphere",
              "docs", "ci", "release", "config", "deps", "other"
            ];
            let component;
            if (context.payload.pull_request) {
              const prTitle = title.match(/^([a-z]+)\(([a-z]+)\)!?: .+$/);
              const actions = ["feat", "fix", "refactor", "chore", "docs", "test", "ci", "build"];
              if (!prTitle || !actions.includes(prTitle[1]) || !components.includes(prTitle[2])) {
                core.setFailed(
                  "PR title must be action(component): summary. " +
                  `Actions: ${actions.join(", ")}. Components: ${components.join(", ")}.`
                );
                return;
              }
              // Only feat and fix reach the release notes, so they must not
              // describe CI-only work. Use the ci action for that instead.
              if (prTitle[2] === "ci" && ["feat", "fix"].includes(prTitle[1])) {
                core.setFailed(
                  `"${prTitle[1]}(ci)" would appear in the release notes. ` +
                  "Use ci(ci): summary for workflow and tooling changes, or test(component): summary for test-only changes."
                );
                return;
              }
              component = prTitle[2];
            } else {
              // GitHub issue forms put the first dropdown at the start of the
              // body. Ignore free text elsewhere in the issue.
              const field = (item.body ?? "").match(/^### Component\r?\n\r?\n([^\r\n]+)/);
              if (field && components.includes(field[1].trim())) {
                component = field[1].trim();
              }
            }

            // Respect area labels already chosen by a maintainer or a prior run.
            // This also keeps edits and PR updates from accumulating labels.
            if ((item.labels ?? []).some(({ name }) => Object.hasOwn(managedLabels, name))) {
              core.info("An area label is already present.");
              return;
            }

            const label = component === "other" ? undefined : component;

            if (!label) {
              core.info("No automatic labels matched.");
              return;
            }

            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: item.number,
                labels: [label]
              });
            } catch (error) {
              // If any managed label is missing, create it on-demand and retry
              if (managedLabels[label]) await ensureLabelExists(label);
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: item.number,
                labels: [label]
              });
            }

            core.info(`Applied label: ${label}`);
