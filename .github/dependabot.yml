version: 2
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
updates:
  - package-ecosystem: docker
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: github-actions
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: gomod
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
