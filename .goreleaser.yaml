version: 2

project_name: vsfleet

before:
  hooks:
    - go mod tidy

builds:
  - id: vsfleet
    main: ./cmd/vsfleet
    binary: vsfleet
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/easonliuuuuu/vsfleet/internal/version.Version={{ .Version }}
      - -X github.com/easonliuuuuu/vsfleet/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/easonliuuuuu/vsfleet/internal/version.Date={{ .Date }}

dockers_v2:
  - id: vsfleet
    ids:
      - vsfleet
    images:
      - ghcr.io/easonliuuuuu/vsfleet
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: true
    annotations:
      "index,manifest:org.opencontainers.image.title": "vsfleet"
      "index,manifest:org.opencontainers.image.description": "Read-only vSphere estate assessment and diagnostics across every vCenter"
      "index,manifest:org.opencontainers.image.url": "https://easonliuuuuu.github.io/vsfleet/"
      "index,manifest:org.opencontainers.image.source": "https://github.com/Easonliuuuuu/vsfleet"
      "index,manifest:org.opencontainers.image.documentation": "https://easonliuuuuu.github.io/vsfleet/containers/"
      "index,manifest:org.opencontainers.image.licenses": "MIT"
      "index,manifest:org.opencontainers.image.version": "{{ .Version }}"
      "index,manifest:org.opencontainers.image.revision": "{{ .FullCommit }}"
      "index,manifest:org.opencontainers.image.created": "{{ .Date }}"
      "index,manifest:org.opencontainers.image.base.name": "gcr.io/distroless/static-debian13:nonroot"
      "index,manifest:org.opencontainers.image.base.digest": "sha256:e2e927ec666bae08560abb3c55d0659eceabb657f56b6782ab500a9fc7f555e3"

docker_signs:
  - id: vsfleet
    artifacts: manifests
    ids:
      - vsfleet
    args:
      - sign
      - "${artifact}@${digest}"
      - --yes

archives:
  - id: vsfleet
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

brews:
  - name: vsfleet
    ids:
      - vsfleet
    homepage: https://github.com/Easonliuuuuu/vsfleet
    description: Read-only vSphere estate assessment and diagnostics across every vCenter
    license: MIT
    test: |
      assert_match version.to_s, shell_output("#{bin}/vsfleet --version")
    repository:
      owner: Easonliuuuuu
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"

nfpms:
  - id: vsfleet
    package_name: vsfleet
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: Eason Liu
    homepage: https://github.com/Easonliuuuuu/vsfleet
    maintainer: Eason Liu
    description: Read-only vSphere estate assessment and diagnostics across every vCenter
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/vsfleet/copyright
      - src: README.md
        dst: /usr/share/doc/vsfleet/README.md

scoops:
  - name: vsfleet
    ids:
      - vsfleet
    homepage: https://github.com/Easonliuuuuu/vsfleet
    description: Read-only vSphere estate assessment and diagnostics across every vCenter
    license: MIT
    repository:
      owner: Easonliuuuuu
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"

checksum:
  name_template: checksums.txt

release:
  mode: keep-existing

changelog:
  disable: true
