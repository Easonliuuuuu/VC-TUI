site_name: vsfleet
site_description: Read-only vSphere estate assessment and diagnostics across every vCenter.
site_url: https://easonliuuuuu.github.io/vsfleet/
repo_name: Easonliuuuuu/vsfleet
repo_url: https://github.com/Easonliuuuuu/vsfleet
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |
  demo.tape

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Containers: containers.md
  - CLI Guide: commands.md
  - Assessments: assessments.md
  - License Metadata: licensing.md
  - Terminal UI: tui.md
  - Configuration: configuration.md
  - Operator Recipes: recipes.md
  - Troubleshooting: troubleshooting.md
  - Architecture: architecture.md
  - Testing: testing.md
  - Test Catalogue: test-catalog.md
  - Synthetic Testbed: testbed.md
  - Contributing: https://github.com/Easonliuuuuu/vsfleet/blob/main/CONTRIBUTING.md
  - Security: https://github.com/Easonliuuuuu/vsfleet/blob/main/SECURITY.md
