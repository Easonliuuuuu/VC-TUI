site_name: vsfleet
site_description: Read-only vSphere estate assessment and diagnostics across every vCenter.
site_url: https://easonliuuuuu.github.io/vsfleet/
repo_name: Easonliuuuuu/vsfleet
repo_url: https://github.com/Easonliuuuuu/vsfleet
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |
  demo.tape

nav:
  - Home: index.md
  - Start here:
      - Getting started: getting-started.md
      - Configuration: configuration.md
      - CLI reference: commands.md
      - Recipes: recipes.md
      - Containers: containers.md
      - Troubleshooting: troubleshooting.md
  - Terminal UI:
      - Browse and manage contexts: tui.md
      - VM dashboard: tui-vm.md
      - Detail actions and SSH: tui-actions.md
      - Datastore browser: tui-storage.md
      - Networks and clusters: tui-network.md
  - Assessments:
      - Capture and history: assessments.md
      - Health and orphan checks: health.md
      - Performance history: performance.md
      - Inventory exports: exports.md
      - Migration and capacity planning: planning.md
      - Tags and custom attributes: metadata.md
      - Sharing inventory: sharing.md
      - License metadata: licensing.md
  - Contributing:
      - Architecture: architecture.md
      - Synthetic testbed: testbed.md
      - Testing: testing.md
      - Test catalogue: test-catalog.md
      - Writing documentation: writing.md
      - Contribution policy: https://github.com/Easonliuuuuu/vsfleet/blob/main/CONTRIBUTING.md
      - Security policy: https://github.com/Easonliuuuuu/vsfleet/blob/main/SECURITY.md
